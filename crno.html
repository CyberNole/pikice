<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ne dotikaj se</title>
<meta name="theme-color" content="#ffffff">
<style>
  /* Bela ploskev; vsak dotik doda pikice, dokler zaslon ne počrni, nato se razletijo. */
  :root {
    --papir: #ffffff;
    --crnilo: #111111;
    --tiho: #6b6b6b;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--papir); color: var(--crnilo); font-family: var(--font);
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .napis {
    position: fixed; left: 0; right: 0;
    bottom: calc(30px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center; font-size: 14px; font-weight: 500; color: var(--tiho);
    pointer-events: none; transition: color 0.4s ease, opacity 0.4s ease;
    text-wrap: balance;
  }
  .napis.svetlo { color: #e6e6e6; }
</style>
</head>
<body>
<canvas id="platno" aria-hidden="true"></canvas>
<div class="napis" id="napis" role="status">Ne dotikaj se zaslona.</div>
<script>
(function () {
  const platno = document.getElementById("platno");
  const ctx = platno.getContext("2d");
  const napis = document.getElementById("napis");
  const DOTIKOV_DO_KONCA = 18;
  const NAPISI = [
    "Ne dotikaj se zaslona.",
    "Rekel sem, ne dotikaj se.",
    "Vsak dotik je slabši.",
    "Nehaj.",
    "Res, nehaj.",
    "Zdaj si pa naredil.",
    "Zaslon se polni.",
    "Še malo in bo čisto črn.",
    "Zadnje opozorilo."
  ];

  let w = 0, h = 0, dpr = 1;
  function velikost() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    w = window.innerWidth; h = window.innerHeight;
    platno.width = Math.round(w * dpr); platno.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  velikost();
  window.addEventListener("resize", velikost);

  let pikice = [];
  let dotikov = 0;
  let eksplozija = false;

  function dodaj(x, y, n, rMax) {
    for (let i = 0; i < n; i++) {
      const kot = Math.random() * Math.PI * 2;
      const hitrost = 0.4 + Math.random() * 2.2;
      pikice.push({
        x: x, y: y,
        vx: Math.cos(kot) * hitrost, vy: Math.sin(kot) * hitrost,
        r: 0.8 + Math.random() * rMax,
        kot: kot, zavoj: (Math.random() - 0.5) * 0.03
      });
    }
  }
  // Začne z nekaj drobnimi, kot prva stran.
  for (let i = 0; i < 60; i++) dodaj(Math.random() * w, Math.random() * h, 1, 1);
  pikice.forEach(function (p) { p.vx *= 0.2; p.vy *= 0.2; });

  function dotik(x, y) {
    if (eksplozija) return;
    dotikov++;
    // Vsak dotik prinese več in večje pikice.
    const n = 30 + dotikov * dotikov * 3;
    dodaj(x, y, n, 1 + dotikov * 0.9);
    napis.textContent = NAPISI[Math.min(NAPISI.length - 1, Math.floor(dotikov / 2))];
    if (dotikov > DOTIKOV_DO_KONCA * 0.6) napis.classList.add("svetlo");
    if (navigator.vibrate) { try { navigator.vibrate(15 + dotikov * 4); } catch (e) {} }
    if (dotikov >= DOTIKOV_DO_KONCA) razleti(x, y);
  }

  function razleti(x, y) {
    eksplozija = true;
    if (navigator.vibrate) { try { navigator.vibrate([60, 40, 120]); } catch (e) {} }
    pikice.forEach(function (p) {
      const dx = p.x - x, dy = p.y - y;
      const d = Math.max(1, Math.hypot(dx, dy));
      const s = 14 + Math.random() * 18;
      p.vx = dx / d * s; p.vy = dy / d * s;
    });
    setTimeout(function () {
      napis.classList.remove("svetlo");
      napis.textContent = "Hecam se. Telefon je v redu.";
    }, 900);
    setTimeout(function () {
      pikice = [];
      for (let i = 0; i < 60; i++) dodaj(Math.random() * w, Math.random() * h, 1, 1);
      pikice.forEach(function (p) { p.vx *= 0.2; p.vy *= 0.2; });
      dotikov = 0;
      eksplozija = false;
    }, 6000);
  }

  function slicica() {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#111111";
    ctx.beginPath();
    const ostanejo = [];
    for (const p of pikice) {
      if (eksplozija) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < -50 || p.x > w + 50 || p.y < -50 || p.y > h + 50) continue;
      } else {
        p.kot += p.zavoj;
        p.vx = p.vx * 0.96 + Math.cos(p.kot) * 0.03;
        p.vy = p.vy * 0.96 + Math.sin(p.kot) * 0.03;
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x += w; else if (p.x > w) p.x -= w;
        if (p.y < 0) p.y += h; else if (p.y > h) p.y -= h;
      }
      ctx.moveTo(p.x + p.r, p.y);
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ostanejo.push(p);
    }
    ctx.fill();
    pikice = ostanejo;
    requestAnimationFrame(slicica);
  }
  requestAnimationFrame(slicica);

  function celZaslon() {
    const el = document.documentElement;
    const z = el.requestFullscreen || el.webkitRequestFullscreen;
    if (z && !document.fullscreenElement) {
      try { const r = z.call(el); if (r && r.catch) r.catch(function () {}); } catch (e) {}
    }
  }
  window.addEventListener("pointerdown", function (ev) {
    if (ev.cancelable) ev.preventDefault();
    dotik(ev.clientX, ev.clientY);
  }, { passive: false });
  window.addEventListener("touchend", celZaslon);
  window.addEventListener("click", celZaslon);
  ["touchmove", "gesturestart", "contextmenu"].forEach(function (ime) {
    window.addEventListener(ime, function (ev) { if (ev.cancelable) ev.preventDefault(); }, { passive: false });
  });
})();
</script>
</body>
</html>
